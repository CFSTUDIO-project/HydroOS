name: Import Hydrogen OS source

on:
  push:
    branches: [main]
    paths:
      - ".seed/READY"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hydrogen-source-import
  cancel-in-progress: false

jobs:
  import-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Reconstruct source archive
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .seed -maxdepth 1 -name 'part-*.b64' | wc -l)" -eq 7
          cat .seed/part-*.b64 | base64 --decode > /tmp/HydrogenOS-V1-project.tar.gz
          gzip -t /tmp/HydrogenOS-V1-project.tar.gz
          mkdir -p /tmp/hydroos
          tar -xzf /tmp/HydrogenOS-V1-project.tar.gz -C /tmp/hydroos
          test -f /tmp/hydroos/hydroos_project/app/src/main/AndroidManifest.xml
          cp -a /tmp/hydroos/hydroos_project/. .
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle.kts")
          lines = p.read_text().splitlines()
          for i, line in enumerate(lines):
              if line.strip() == "kotlinOptions {":
                  del lines[i:i + 3]
                  break
          insert_at = next(i for i, line in enumerate(lines) if line.strip() == "dependencies {")
          lines[insert_at:insert_at] = [
              "kotlin {",
              "    compilerOptions {",
              "        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.fromTarget('17')",
              "    }",
              "}",
              "",
          ]
          p.write_text("import org.jetbrains.kotlin.gradle.dsl.JvmTarget\\n\\n" + "\\n".join(lines) + "\\n")
          p = Path("app/src/main/kotlin/com/cfstudio/hydrogenos/ui/HydrogenApp.kt")
          lines = p.read_text().splitlines()
          if not any("import androidx.compose.foundation.layout.size" in line for line in lines):
              i = next(i for i, line in enumerate(lines) if "import androidx.compose.foundation.layout.padding" in line)
              lines.insert(i + 1, "import androidx.compose.foundation.layout.size")
          s = "\\n".join(lines) + "\\n"
          s = s.replace("androidx.compose.ui.unit.sp(1.6)", "1.6.sp")
          p.write_text(s)
          PY
          rm -rf .seed /tmp/hydroos /tmp/HydrogenOS-V1-project.tar.gz
          rm -f .github/workflows/import-project.yml

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Generate and commit Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon wrapper --gradle-version 8.13 --distribution-type bin
          chmod +x gradlew
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
          if ! git diff --cached --quiet; then
            git commit -m "Add Gradle 8.13 wrapper"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Install Android SDK packages
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Run unit tests
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Assemble debug APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hydrogen-OS-V1-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
